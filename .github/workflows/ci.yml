name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-pty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc pkg-config shellcheck tmux python3
      - name: Strict Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
          python3 tests/probe_sandbox.py target/release/bashlume-probe
          cargo test --release -- --ignored --nocapture
      - name: Build signed conformance pack
        run: |
          target/release/bashlume-pack build \
            tests/fixtures/rules/demo.json /tmp/bashlume-demo.blp \
            tests/fixtures/rules/test-signing-key.hex
          target/release/bashlume-pack verify /tmp/bashlume-demo.blp \
            tests/fixtures/rules/test-verifying-key.hex
      - name: Extract a Bash 5.0 compatibility binary
        run: |
          docker run --rm -v "${RUNNER_TEMP}:/out" ubuntu:20.04 \
            sh -euxc 'cp /bin/bash /out/bash-5.0 && chmod 755 /out/bash-5.0'
          "${RUNNER_TEMP}/bash-5.0" --version | grep -q 'version 5\.0'
      - name: PTY, tmux, and resource regressions
        run: |
          shellcheck shell/bashlume.bash scripts/check.sh
          python3 tests/pty_smoke.py target/release/libbashlume.so \
            --rule-pack /tmp/bashlume-demo.blp \
            --trusted-key tests/fixtures/rules/test-verifying-key.hex
          python3 tests/pty_smoke.py target/release/libbashlume.so \
            --bash "${RUNNER_TEMP}/bash-5.0" \
            --rule-pack /tmp/bashlume-demo.blp \
            --trusted-key tests/fixtures/rules/test-verifying-key.hex
          python3 tests/tmux_bottom.py target/release/libbashlume.so
          python3 tests/resource_budget.py target/release/libbashlume.so

  nix-release-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build release-bound package outputs
        run: |
          nix build .#default --out-link result
          nix build .#bashlume-core --out-link result-core
          nix build .#bashlume-with-all-rules --out-link result-all
      - name: Verify locked hashes and signatures
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          lock = json.loads(pathlib.Path("rules/packs.lock").read_text())
          root = pathlib.Path("result-all/share/bashlume/rules")
          for source, expected in lock["packs"].items():
              pack = root / expected["asset"]
              actual = hashlib.sha256(pack.read_bytes()).hexdigest()
              assert actual == expected["sha256"], (source, actual, expected["sha256"])
          PY
          for source in bash fish zsh; do
            result-all/bin/bashlume-pack verify \
              "result-all/share/bashlume/rules/$source.blp" \
              "result-all/share/bashlume/trusted-keys/$source-rules.pub"
          done
          test -f result/share/bashlume/rules/bash.blp
          test ! -e result/share/bashlume/rules/fish.blp
          test ! -e result/share/bashlume/rules/zsh.blp
      - name: Merge all three installed sources in a PTY
        run: |
          python3 tests/multishell_rules.py \
            result-all/lib/bash/libbashlume.so \
            --bash /bin/bash \
            --bash-pack result-all/share/bashlume/rules/bash.blp \
            --fish-pack result-all/share/bashlume/rules/fish.blp \
            --zsh-pack result-all/share/bashlume/rules/zsh.blp \
            --trusted-key result-all/share/bashlume/trusted-keys/bash-rules.pub \
            --trusted-key result-all/share/bashlume/trusted-keys/fish-rules.pub \
            --trusted-key result-all/share/bashlume/trusted-keys/zsh-rules.pub
          python3 tests/packaged_rules.py \
            result-all/share/bashlume/bashlume.bash \
            --bash /bin/bash
          python3 tests/packaged_rules.py \
            result-core/share/bashlume/bashlume.bash \
            --bash /bin/bash \
            --external-pack result-all/share/bashlume/rules/bash.blp \
            --expect-source bash
